[[mods]]
modId="cuupsidedown"
version="1.2.0-beta.4"
displayName="Unyielding: Upside Down Dungeons"
authors="Cobblemon Unyielding"
description='''
Gravity zones. Inside a zone set with /flipzone, gravity points up (players stand on the ceiling with the
camera turned over) or sideways (any wall becomes the floor: real wall walking, the view turns with you).
Players, mobs, Pokemon, items and thrown things all follow the zone's gravity.
Includes the original gravity layouts, Mimic module, a 100-room Sakura Labyrinth and mirrored Japanese pagoda.
Place either dungeon with /place structure. Optional previews, protected blocks, backups and per-player loot are available.
Needed on both the server and the client. Replaces the old separate Upside Down and Mimic Dungeon jars.
'''

[[mixins]]
config="cuupsidedown.mixins.json"

[[dependencies.cuupsidedown]]
modId="neoforge"
type="required"
versionRange="[21.1.195,)"
ordering="NONE"
side="BOTH"

