[[mods]]
modId="cumimic"
version="1.0.1"
displayName="Unyielding: Mimic Dungeon"
authors="Cobblemon Unyielding"
description='''
Mimics: spawner mobs tagged cu_mimic look like a random online player and wear a copy of that
player's current gear. They only drop cow loot, deaths say "slain by Mimic", and the Mimic
Pagoda advancements track kills and floors. Server-side only.
'''
displayTest="IGNORE_ALL_VERSION"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

